services:
  # Backend - Java Spring Boot API
  - type: web
    name: card-spend-analytics-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: PORT
        value: 8080
      - key: cors.allowed-origins
        value: https://frontend-henna-pi-83.vercel.app
    healthCheckPath: /api/cards
