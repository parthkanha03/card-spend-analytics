services:
  # Backend - Java Spring Boot API
  - type: web
    name: card-spend-analytics-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: cors.allowed-origins
        value: https://card-spend-analytics.onrender.com
    healthCheckPath: /api/cards

  # Frontend - React Static Site
  - type: web
    name: card-spend-analytics
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    plan: free
    envVars:
      - key: VITE_API_URL
        value: https://card-spend-analytics-api.onrender.com
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
